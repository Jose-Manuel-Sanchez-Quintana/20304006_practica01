name: API CI AND CD

on:
  push:
    branches: [main, develop, devlop_test_push]
  pull_request:
    branches: [main, develop, devlop_test_push]

jobs:
  testing:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4 # git clone into runner

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install Dependencies
        run: npm install

      - name: Run unit and integration tests
        run: npm run test

  build:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/taskapi:latest

      - name: Build and push Docker images
        uses: docker/build-push-action@v5.3.0

      - name: App service auth
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'josesanchez-api-test'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: '${{ secrets.DOCKERHUB_USERNAME }}/taskapi:latest'
          
      - name: CI/CD success OK
        if: success()
        uses: rtCamp/action-slack-notify@v2
        with:
          status: 'passed'
          text: 'Node CI/CD succesfully'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}